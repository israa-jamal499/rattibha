<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://moodle.ucas.edu.ps; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://moodle.ucas.edu.ps; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>رتّبها — مخطط طلاب UCAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>
/* Layout: sticky top bar + tab nav, one content column (max 1080px). Week grid Sat→Fri. */
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#15202B; --muted:#5D6A77; --line:#D9DFE5;
  --accent:#1F4E86; --accent-soft:#E2EBF6; --accent-ink:#FFFFFF;
  --ok:#2C6A3D; --ok-soft:#E0F0E4; --warn:#8A5A00; --warn-soft:#FBEFD3; --bad:#B0261E; --bad-soft:#FAE4E2;
  --new:#5A4A99; --new-soft:#ECE7F8; --focus:#B4641C; --focus-soft:#FBEADB;
  --glow1:rgba(31,78,134,.12); --glow2:rgba(44,122,104,.11); --glow3:rgba(121,89,168,.10); --card-bg:rgba(255,255,255,.72); --bar-bg:rgba(255,255,255,.78);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E141B; --surface:#17202A; --sunk:#111922; --ink:#E5EAF0; --muted:#97A3B0; --line:#29343F;
  --accent:#86AEE3; --accent-soft:#1C2D44; --accent-ink:#0E141B;
  --ok:#7CC58F; --ok-soft:#172E20; --warn:#E6B85A; --warn-soft:#33270E; --bad:#F08A80; --bad-soft:#381D1B;
  --new:#B4A6EC; --new-soft:#282240; --focus:#E39A52; --focus-soft:#33240F;
  --glow1:rgba(134,174,227,.13); --glow2:rgba(124,197,143,.09); --glow3:rgba(180,166,236,.11); --card-bg:rgba(23,32,42,.68); --bar-bg:rgba(20,28,37,.80); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 88% -8%, var(--glow1), transparent 62%),
    radial-gradient(760px 620px at -12% 18%, var(--glow2), transparent 58%),
    radial-gradient(820px 560px at 55% 118%, var(--glow3), transparent 62%)}
a{color:inherit}
@supports (backdrop-filter:blur(8px)){
  .card{background:var(--card-bg);backdrop-filter:blur(10px)}
  .bar{background:var(--bar-bg);backdrop-filter:blur(12px)}}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.45rem;font-weight:800} h2{font-size:1.1rem;font-weight:600} h3{font-size:.92rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--accent)}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.nav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:8px;white-space:nowrap;font-weight:500}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sync{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}

main{max-width:1080px;margin:0 auto;padding:20px 16px 90px;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:3px 10px;font-size:.8rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.25}
.stat span{font-size:.82rem;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)} .stat.new b{color:var(--new)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sunk);border-radius:9px;padding:8px 10px 8px 8px}
.row .bar4{align-self:stretch;border-radius:4px}
.row .t{font-weight:600;overflow-wrap:anywhere;text-decoration:none}
.row a.t:hover{text-decoration:underline}
.row .m{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.row .end{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.st{font-size:.76rem;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)}
.st.bad{background:var(--bad-soft);color:var(--bad)} .st.new{background:var(--new-soft);color:var(--new)} .st.mute{background:var(--surface);color:var(--muted)}
.st.focus{background:var(--focus-soft);color:var(--focus)}
.cd{font-size:.78rem;font-weight:600}
.cd.bad{color:var(--bad)} .cd.warn{color:var(--warn)}
.star{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:2px}
.star.on{color:var(--focus)}
.empty{color:var(--muted);font-size:.9rem;padding:6px 2px}
.notstarted{font-size:.72rem;font-weight:700;color:var(--bad)}

.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;text-decoration:none;border-top:4px solid var(--c)}
.ccard:hover{border-color:var(--c)}
.ccard .teacher{font-size:.8rem;color:var(--muted)}
.prog{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec{display:grid;gap:6px}
.sec h3{color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;align-content:start;gap:6px;min-height:170px}
.day.today{border-color:var(--warn);box-shadow:inset 0 3px 0 var(--warn)}
.day.past{opacity:.6}
.day h3{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.ses{border:0;text-align:start;cursor:pointer;border-radius:7px;padding:5px 7px;background:var(--sunk);border-inline-start:3px solid var(--c);display:grid;gap:1px;font-size:.78rem;overflow-wrap:anywhere;position:relative}
.ses b{font-weight:600}
.ses small{color:var(--muted)}
.ses.done{opacity:.55;text-decoration:line-through}
.ses .play{position:absolute;inset-inline-end:6px;inset-block-start:6px;font-size:.7rem;color:var(--accent)}
.dl{font-size:.74rem;color:var(--bad);border-top:1px dashed var(--line);padding-top:4px}
.addday{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:7px;font:inherit;font-size:.74rem;cursor:pointer;padding:3px;margin-top:2px}
.addday:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:860px){.week{grid-template-columns:1fr}.day{min-height:0}}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
input,select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%;min-width:0}
details>summary{cursor:pointer;font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 12px;font-size:.88rem}
.infobox{background:var(--accent-soft);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:.88rem}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.5rem}
.kpi span{font-size:.8rem;color:var(--muted)}
canvas{max-width:100%;display:block}
.barline{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.barline .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.barline .track i{display:block;height:100%;border-radius:6px}
.barline .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* exam */
.exam{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--focus-soft);border:1px solid var(--focus);border-radius:10px;padding:10px 12px}
.exam .big{font-family:var(--f-display);font-size:1.7rem;color:var(--focus);line-height:1}

/* pomodoro dock */
.dock{position:fixed;inset-block-end:0;inset-inline:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.dock-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:84px}
.dock .ti{flex:1;min-width:140px}
.dock .ti b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phase{font-size:.78rem;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.phase.brk{background:var(--ok-soft);color:var(--ok)}

.login{max-width:420px;margin:8vh auto 0}
.login .brand{font-size:2rem}
.err{color:var(--bad);font-size:.9rem;white-space:pre-wrap}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:30;font-size:.9rem}
footer{max-width:1080px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.78rem}
@media (prefers-reduced-motion:no-preference){.prog i,.track i{transition:width .4s}}

@media print{
  .bar,.dock,footer,.btn,.chips,details{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .day{break-inside:avoid;border:1px solid #bbb;min-height:0}
  .week{grid-template-columns:repeat(7,1fr)}
  .ses{background:#f3f3f3;color:#000}
  @page{size:landscape;margin:1cm}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="dock"></div>
<footer>رتّبها مشروع طلابي. بيتصل مباشرة من متصفحك بمودل الكلية، وما في أي سيرفر وسيط بيشوف بياناتك أو كلمة سرك.</footer>

<script>
(()=>{
/* ================= config & utils ================= */
const SITE='https://moodle.ucas.edu.ps';
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const COLORS=['#1F4E86','#2C7A68','#9A4A8B','#B4641C','#4E6D2C','#7959A8','#A33A3A','#2B7EA0','#7F701B','#55598A'];
const TYPE={resource:'ملف',url:'رابط',page:'صفحة',folder:'مجلد',book:'كتاب',h5pactivity:'تفاعلي',lesson:'درس',feedback:'استبيان',choice:'تصويت'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<(script|style)[\s\S]*?<\/\1>/gi,'');return d.textContent.trim()};
const safeUrl=u=>typeof u==='string'&&u.startsWith(SITE+'/')?u:SITE;
const nowS=()=>Math.floor(Date.now()/1000);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{const x=sod(d);x.setDate(x.getDate()-((x.getDay()+1)%7));return x};
const fmtTime=d=>{let h=d.getHours();const ap=h<12?'ص':'م';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap};
const fmtDay=d=>DAYS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
const fmtDue=s=>s?fmtDay(new Date(s*1000))+' · '+fmtTime(new Date(s*1000)):'بدون موعد';
const twoNums=str=>{const m=String(str||'').replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);return m?[+m[1],+m[2]]:null};
function countdown(s){
  if(!s)return {t:'',c:''};
  const diff=s-nowS(),days=Math.floor((sod(new Date(s*1000))-sod(new Date()))/864e5);
  if(diff<0)return {t:'فات الموعد',c:'bad'};
  if(days===0)return {t:'اليوم '+fmtTime(new Date(s*1000)),c:'bad'};
  if(days===1)return {t:'بكرة',c:'warn'};
  if(days<=3)return {t:'باقي '+days+' أيام',c:'warn'};
  return {t:'باقي '+days+' يوم',c:''};
}
const store={
  get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let tt;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}

/* ================= state ================= */
const S={token:null,uid:null,me:null,data:null,loading:false,error:'',weekOffset:0};
function getToken(){try{return sessionStorage.getItem('rt')||localStorage.getItem('rt')}catch(e){return null}}
function remembered(){try{return !!localStorage.getItem('rt')}catch(e){return false}}
function setToken(t,remember){try{sessionStorage.removeItem('rt');localStorage.removeItem('rt');(remember?localStorage:sessionStorage).setItem('rt',t)}catch(e){}}
const K=name=>'r:'+S.uid+':'+name;

/* ================= Moodle API ================= */
function flat(obj,prefix,out){for(const [k,v] of Object.entries(obj)){const key=prefix?`${prefix}[${k}]`:k;
  if(v!==null&&typeof v==='object')flat(v,key,out);else out.append(key,v)}return out}
async function ws(fn,params={}){
  const body=flat(params,'',new URLSearchParams({wstoken:S.token,wsfunction:fn,moodlewsrestformat:'json'}));
  const r=await fetch(SITE+'/webservice/rest/server.php',{method:'POST',body,credentials:'omit'});
  const j=await r.json();
  if(j&&j.exception){const e=new Error(j.message);e.code=j.errorcode;throw e}
  return j;
}
async function pool(items,n,f){const out=new Array(items.length);let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;try{out[k]=await f(items[k])}catch(e){out[k]=null}}}));return out}

async function login(username,password,remember){
  const r=await fetch(SITE+'/login/token.php',{method:'POST',credentials:'omit',body:new URLSearchParams({username,password,service:'moodle_mobile_app'})});
  const j=await r.json();
  if(!j.token){throw new Error(j.errorcode==='invalidlogin'?'اسم المستخدم أو كلمة السر غلط.':'المودل رفض الدخول: '+(j.error||j.errorcode))}
  S.token=j.token;setToken(j.token,remember);
}

async function fetchAll(){
  const me=await ws('core_webservice_get_site_info');
  S.me={name:me.fullname,first:me.firstname||me.fullname.split(' ')[0]};S.uid=me.userid;
  const raw=(await ws('core_enrol_get_users_courses',{userid:me.userid})).filter(c=>c.visible!==0);
  const ids=raw.map(c=>c.id);
  const [ar,qr]=await Promise.all([
    ws('mod_assign_get_assignments',{courseids:ids}).catch(()=>({courses:[]})),
    ws('mod_quiz_get_quizzes_by_courses',{courseids:ids}).catch(()=>({quizzes:[]}))]);
  const assigns=[];(ar.courses||[]).forEach(c=>(c.assignments||[]).forEach(a=>assigns.push({...a,course:c.id})));
  const quizzes=qr.quizzes||[];
  const [aSt,qAt,qBest,cont]=await Promise.all([
    pool(assigns,4,a=>ws('mod_assign_get_submission_status',{assignid:a.id})),
    pool(quizzes,4,q=>ws('mod_quiz_get_user_attempts',{quizid:q.id,status:'all'})),
    pool(quizzes,4,q=>ws('mod_quiz_get_user_best_grade',{quizid:q.id})),
    pool(raw,3,c=>ws('core_course_get_contents',{courseid:c.id}))]);

  const courses=raw.map((c,i)=>{const parts=c.fullname.split(/\s+-\s+/);
    return {id:c.id,name:parts[0].trim(),teacher:parts.slice(1).join(' - ').trim(),code:c.shortname,color:COLORS[i%COLORS.length]}});
  const items=[];
  assigns.forEach((a,i)=>{const s=aState(a,aSt[i]);items.push({key:'a'+a.id,type:'assign',courseId:a.course,name:a.name,due:a.duedate||0,
    started:s.started,url:SITE+'/mod/assign/view.php?id='+a.cmid,...s})});
  quizzes.forEach((q,i)=>{const s=qState(q,qAt[i],qBest[i]);items.push({key:'q'+q.id,type:'quiz',courseId:q.course,name:q.name,due:q.timeclose||0,
    open:q.timeopen||0,started:s.started,url:SITE+'/mod/quiz/view.php?id='+q.coursemodule,...s})});
  const sections={},content=[];
  raw.forEach((c,i)=>{const secs=Array.isArray(cont[i])?cont[i]:[];sections[c.id]=secs.map(s=>({name:s.name,mods:(s.modules||[])
    .filter(m=>!['label','assign','quiz'].includes(m.modname)&&m.uservisible!==false)
    .map(m=>{const t=Math.max(m.added||0,(m.contentsinfo&&m.contentsinfo.lastmodified)||0,...(m.contents||[]).map(f=>f.timemodified||0));
      const o={id:m.id,courseId:c.id,name:m.name,url:m.url,type:m.modname,section:s.name,t};content.push(o);return o})})).filter(s=>s.mods.length)});
  return {courses,items,sections,content,at:Date.now()};
}
function aState(a,st){
  if(!st)return {status:'unknown',label:'تعذّر الفحص',cls:'mute',started:false};
  const sub=(st.lastattempt&&(st.lastattempt.submission||st.lastattempt.teamsubmission))||{};
  const disp=st.feedback&&st.feedback.gradefordisplay?st.feedback.gradefordisplay:'';
  const g=twoNums(strip(disp)),grade=g?null:strip(disp);
  const started=sub.status==='submitted'||sub.status==='draft';
  if(sub.status==='submitted')return {status:'done',label:g?'مُسلّم · '+strip(disp):(grade?'مُسلّم · '+grade:'مُسلّم'),cls:'ok',pct:g?g[0]/g[1]*100:null,started:true};
  if(g||grade)return {status:'done',label:'مقيّم · '+strip(disp),cls:'ok',pct:g?g[0]/g[1]*100:null,started:true};
  if(a.duedate&&a.duedate<nowS()){const closed=(a.cutoffdate&&a.cutoffdate<nowS());
    return {status:closed?'missed':'late',label:closed?'سكّر بدون تسليم':'متأخر، لسا مفتوح',cls:'bad',started}}
  if(sub.status==='draft')return {status:'todo',label:'مسودة، مش مُسلّم',cls:'warn',started:true};
  return {status:'todo',label:'لم يُسلّم',cls:'warn',started:false};
}
const g2=x=>(+x).toFixed(2).replace(/\.?0+$/,'');
function qState(q,att,best){
  const at=(att&&att.attempts)||[],fin=at.some(x=>x.state==='finished'),started=at.length>0;
  const hasG=best&&best.hasgrade,pct=hasG&&q.grade?best.grade/q.grade*100:null;
  const b=hasG?g2(best.grade)+'/'+g2(q.grade):'';
  if(fin)return {status:'done',label:b?'منتهي · '+b:'منتهي',cls:'ok',pct,started:true};
  if(at.some(x=>x.state==='inprogress'))return {status:'todo',label:'محاولة مفتوحة',cls:'warn',started:true};

/* ================= study plan ================= */
const DEF_SET={hours:{6:3,0:3,1:3,2:3,3:3,4:3,5:2},start:'16:00',len:60,brk:10,assignH:2,quizH:1,examH:3,reviewMode:'all'};
function settings(){const raw=store.get(K('plan-set'),{});const s={...DEF_SET,...raw,hours:{...DEF_SET.hours,...(raw.hours||{})}};
  if(raw.reviewMode===undefined&&raw.review!==undefined)s.reviewMode=raw.review?'all':'off';return s}
// lectures of a course, oldest-first, for ordered review coverage
function lecturePool(courseId){const secs=S.data.sections[courseId]||[];const out=[];secs.forEach(s=>s.mods.forEach(m=>out.push(m)));return out}
function genId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function generatePlan(ws0,keepUntil){
  const set=settings(),items=allItems().filter(pending),now=Date.now();
  const jobs=items.map(i=>{let est=i.type==='quiz'?set.quizH:i.type==='task'?(i.est||1):set.assignH;if(i.exam)est=Math.max(est,set.examH);
    let due=i.due?i.due*1000:now+14*864e5;if(due<now)due=now+864e5;
    return {i,left:Math.round(est*60),due}}).sort((a,b)=>(b.i.exam-a.i.exam)||(a.due-b.due));
  const seen=seenSet();
  // review pools per course: all lectures (reviewMode 'all') or only unseen ('new')
  const pools={};S.data.courses.forEach(c=>{let L=lecturePool(c.id);if(set.reviewMode==='new')L=L.filter(x=>isNew(x,seen));pools[c.id]=L.slice()});
  const rot=[...S.data.courses].sort((a,b)=>pools[b.id].length-pools[a.id].length);let ri=0;
  const old=store.get(K('plan:'+ymd(ws0)),{sessions:[]});
  // keep: past slots, done, and anything the student added or edited herself
  const kept=old.sessions.filter(s=>s.manual||s.done||s.start<keepUntil);
  const sessions=[...kept],[h,m]=set.start.split(':').map(Number);
  const overlaps=(st,en)=>kept.some(s=>st<s.end&&en>s.start);
  for(let k=0;k<7;k++){
    const day=addDays(ws0,k),cap=(+set.hours[day.getDay()]||0)*60;let used=0;
    let t=new Date(day);t.setHours(h,m,0,0);
    while(used+set.len<=cap){
      const st=t.getTime(),en=st+set.len*60000;t=new Date(en+set.brk*60000);used+=set.len;
      if(st<keepUntil||overlaps(st,en))continue;
      const job=jobs.find(j=>j.left>0&&j.due>=en);
      if(job){job.left-=set.len;const c=courseOf(job.i.courseId);
        sessions.push({id:genId(),start:st,end:en,courseId:job.i.courseId,color:c.color,ref:job.i.key,
          title:(job.i.exam?'📘 امتحان: ':job.i.type==='quiz'?'تحضير كويز: ':job.i.type==='task'?'':'حل: ')+job.i.name,sub:c.name,kind:job.i.type,done:false});continue}
      if(set.reviewMode==='off'||!rot.length)break;
      // pick next course that still has lectures to review
      let picked=null;for(let n=0;n<rot.length;n++){const c=rot[(ri+n)%rot.length];if(pools[c.id].length){picked=c;ri=(ri+n+1)%rot.length;break}}
      if(!picked)break;
      const nx=pools[picked.id].shift();
      sessions.push({id:genId(),start:st,end:en,courseId:picked.id,color:picked.color,ref:'',title:'مراجعة: '+nx.name,sub:picked.name,kind:'review',done:false});
    }
  }
  sessions.sort((a,b)=>a.start-b.start);
  const weekEnd=addDays(ws0,7).getTime();
  const short=jobs.filter(j=>j.left>0&&j.due<weekEnd).map(j=>j.i.name);
  const leftover={};S.data.courses.forEach(c=>{if(pools[c.id].length)leftover[c.id]=pools[c.id].length});
  const plan={sessions,short,leftover,at:Date.now()};store.set(K('plan:'+ymd(ws0)),plan);return plan;
}
function getPlan(ws0){const p=store.get(K('plan:'+ymd(ws0)),null);if(p)return p;
  const keep=ws0.getTime()<=Date.now()?Date.now():0;return generatePlan(ws0,keep)}
function sessionById(wkKey,id){const p=store.get(K('plan:'+wkKey),null);return p?{plan:p,s:p.sessions.find(x=>x.id===id),key:K('plan:'+wkKey)}:null}
function exportICS(plan,ws0){
  const z=d=>{const x=new Date(d);return x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+'T'+pad(x.getUTCHours())+pad(x.getUTCMinutes())+'00Z'};
  const e=s=>String(s).replace(/([,;\\])/g,'\\$1');
  const ev=plan.sessions.map(s=>['BEGIN:VEVENT','UID:'+s.id+'-'+S.uid+'@rattibha','DTSTAMP:'+z(Date.now()),'DTSTART:'+z(s.start),'DTEND:'+z(s.end),
    'SUMMARY:'+e(s.title),'DESCRIPTION:'+e(s.sub),'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:'+e(s.title),'END:VALARM','END:VEVENT'].join('\r\n'));
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rattibha//AR',...ev,'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='جدول-دراسة-'+ymd(ws0)+'.ics';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

const P={active:false,sesId:null,wkKey:null,courseId:0,title:'',phase:'work',remain:0,timer:null,workLen:25,breakLen:5};
function startPomodoro(wkKey,sesId){
  const found=sessionById(wkKey,sesId);const s=found&&found.s;
  const set=settings();
  P.active=true;P.sesId=sesId;P.wkKey=wkKey;P.courseId=s?s.courseId:0;P.title=s?s.title:'دراسة حرة';
  P.phase='work';P.workLen=Math.min(set.len,50);P.breakLen=set.brk||5;P.remain=P.workLen*60;
  tick(true);clearInterval(P.timer);P.timer=setInterval(tick,1000);renderDock();
}
function tick(skip){
  if(!skip){P.remain--;}
  if(P.remain<0){
    if(P.phase==='work'){addFocus(P.courseId,P.workLen);try{if(store.get(K('notif-on'),false)&&Notification.permission==='granted')new Notification('خلصت جلسة تركيز 🎉',{body:'خذي استراحة '+P.breakLen+' دقايق'})}catch(e){}
      P.phase='break';P.remain=P.breakLen*60;toast('جلسة تركيز خلصت، استراحة!');}
    else{P.phase='work';P.remain=P.workLen*60;toast('يلا نكمّل');}
  }
  renderDock();
}
function stopPomodoro(markDone){
  clearInterval(P.timer);
  if(markDone&&P.sesId){const f=sessionById(P.wkKey,P.sesId);if(f&&f.s){f.s.done=true;store.set(f.key,f.plan)}}
  P.active=false;P.timer=null;renderDock();
  if(['#plan','#home','','#'].includes(location.hash)||location.hash.startsWith('#plan'))render();
}
function renderDock(){
  const d=$('#dock');
  if(!P.active){d.innerHTML='';return}
  const mm=Math.floor(P.remain/60),ss=P.remain%60;
  d.innerHTML=`<div class="dock"><div class="dock-in">
    <span class="timer">${pad(mm)}:${pad(ss)}</span>
    <span class="phase ${P.phase==='break'?'brk':''}">${P.phase==='break'?'استراحة':'تركيز'}</span>
    <div class="ti"><b>${esc(P.title)}</b><small class="muted">${esc(courseOf(P.courseId).name)}</small></div>

    <button class="btn sm primary" data-pomo="done">خلّصت الجلسة ✓</button>
    <button class="btn sm ghost" data-pomo="stop">إنهاء</button></div></div>`;

function drawTrend(){
  const cv=$('#trend');if(!cv)return;const hist=store.get(K('hist'),[]);
  const cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue('--muted').trim()||'#888',acc=cs.getPropertyValue('--accent').trim()||'#1F4E86',line=cs.getPropertyValue('--line').trim()||'#ccc';
  const w=cv.clientWidth||600,h=140,dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);
  const pts=hist.slice(-14);
  x.font='12px sans-serif';x.fillStyle=ink;x.textAlign='right';
  if(pts.length<2){x.textAlign='center';x.fillText('منحنى إنجازك رح يبان بعد كم يوم استخدام',w/2,h/2);return}
  const pad=28,maxV=Math.max(...pts.map(p=>p.total),1);
  [0,.5,1].forEach(f=>{const yy=pad+(h-2*pad)*(1-f);x.strokeStyle=line;x.beginPath();x.moveTo(34,yy);x.lineTo(w-6,yy);x.stroke();
    x.fillStyle=ink;x.fillText(Math.round(maxV*f),30,yy+4)});
  const sx=i=>34+(w-40)*(i/(pts.length-1)),sy=v=>pad+(h-2*pad)*(1-v/maxV);
  x.strokeStyle=acc;x.lineWidth=2;x.beginPath();pts.forEach((p,i)=>{i?x.lineTo(sx(i),sy(p.done)):x.moveTo(sx(i),sy(p.done))});x.stroke();
  x.fillStyle=acc;pts.forEach((p,i)=>{x.beginPath();x.arc(sx(i),sy(p.done),3,0,7);x.fill()});
  x.fillStyle=ink;x.textAlign='center';x.fillText('المنجز عبر آخر '+pts.length+' يوم',w/2,h-6);
}

function render(){

  if(!S.data){root.innerHTML=shell('<div class="card">جاري جلب بياناتك من المودل… أول مرة ممكن تاخذ دقيقة.</div>');return}
  const [r,arg]=route();
  const v=r==='courses'?viewCourses():r==='course'?viewCourse(arg):r==='plan'?viewPlan():r==='analytics'?viewAnalytics()
    :r==='tasks'?viewTasks():r==='account'||r==='logout'?viewAccount():viewHome();

  renderDock();
}
function logSession(){const log=store.get(K('sessions'),[]);

async function refresh(){
  if(S.loading)return;S.loading=true;S.error='';render();
  try{const d=await fetchAll();S.data=d;
    if(remembered()){store.set('r:'+S.uid+':cache',{d,me:S.me});store.set('r:last',S.uid)}
    recordHistory();checkDeadlines();}
  catch(e){
    if(e.code==='invalidtoken'||e.code==='accessexception'){logout('انتهت الجلسة، سجلي دخول مرة ثانية.');return}
    S.error=e instanceof TypeError?'ما قدرت أوصل للمودل. تأكدي من النت وجربي "تحديث".':'صار خطأ: '+e.message;
  }finally{S.loading=false;render()}
}
function logout(msg,wipe){
  const uid=S.uid;S.token=null;S.data=null;S.error=msg||'';
  try{sessionStorage.removeItem('rt');localStorage.removeItem('rt')}catch(e){}
  store.del('r:last');if(uid)store.del('r:'+uid+':cache');
  if(wipe&&uid){try{Object.keys(localStorage).filter(k=>k.startsWith('r:'+uid+':')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
  if(P.active)stopPomodoro(false);
  location.hash='';render();
  if(!msg)toast(wipe?'طلعتي وانمسحت كل بياناتك من هالجهاز':'طلعتي من الحساب');
}

    store.set(K('plan-set'),{hours,start:$('#sStart').value||'16:00',len:+$('#sLen').value,brk:+$('#sBrk').value,assignH:+$('#sA').value||2,quizH:+$('#sQ').value||1,examH:+$('#sE').value||3,reviewMode:$('#sR').value});
    const ws0=addDays(weekStart(new Date()),7*S.weekOffset);generatePlan(ws0,ws0.getTime()<=Date.now()?Date.now():0);toast('انحفظت الإعدادات');render()}
  else if(b.dataset.manual){toggleManual(b.dataset.manual);render()}
  else if(b.dataset.exam){toggleExam(b.dataset.exam);render()}
  else if(b.dataset.taskToggle){const t=myTasks(),x=t.find(y=>y.id===b.dataset.taskToggle);if(x){x.done=!x.done;saveTasks(t);render()}}
  else if(b.dataset.taskDel){if(b.dataset.armed){saveTasks(myTasks().filter(y=>y.id!==b.dataset.taskDel));render()}else{b.dataset.armed='1';b.textContent='متأكدة؟'}}
  else if(b.dataset.ses)sessionMenu(b.dataset.wk,b.dataset.ses);
  else if(b.dataset.addses!==undefined)openSessionForm(b.dataset.addses,null,b.dataset.day||null);
  else if(b.dataset.wkNav!==undefined){const n=+b.dataset.wkNav;S.weekOffset=n===0?0:S.weekOffset+n;render()}
  else if(b.dataset.pomo==='pause'){if(P.timer){clearInterval(P.timer);P.timer=null}else{P.timer=setInterval(tick,1000)}renderDock()}
  else if(b.dataset.pomo==='done')stopPomodoro(true);
  else if(b.dataset.pomo==='stop')stopPomodoro(false);
});
let sheetEl;
function mkModal(html){const el=document.createElement('div');
  el.style.cssText='position:fixed;inset:0;background:rgba(10,15,20,.5);display:grid;place-items:center;z-index:40;padding:16px';
  el.innerHTML='<div class="card" style="max-width:420px;width:100%">'+html+'</div>';document.body.appendChild(el);return el}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}}
function sessionMenu(wkKey,id){const f=sessionById(wkKey,id);if(!f||!f.s)return;openSheet(wkKey,f.s)}
function openSheet(wkKey,s){
  closeSheet();
  sheetEl=mkModal(`<h2>${esc(s.title)}</h2><div class="muted small">${fmtDay(new Date(s.start))} · ${fmtTime(new Date(s.start))} – ${fmtTime(new Date(s.end))} · ${esc(s.sub)}</div>
    <div class="chips"><button class="btn primary" data-sheet="pomo">▶ مؤقّت تركيز</button>
    <button class="btn" data-sheet="toggle">${s.done?'رجّعيها':'خلصت ✓'}</button>
    <button class="btn" data-sheet="edit">تعديل</button>
    <button class="btn ghost" data-sheet="del">حذف</button></div>`);
  sheetEl.addEventListener('click',ev=>{const t=ev.target.closest('[data-sheet]');if(!t){if(ev.target===sheetEl)closeSheet();return}
    const act=t.dataset.sheet;
    if(act==='pomo'){closeSheet();startPomodoro(wkKey,s.id)}
    else if(act==='toggle'){const f=sessionById(wkKey,s.id);if(f&&f.s){f.s.done=!f.s.done;f.s.manual=true;store.set(f.key,f.plan)}closeSheet();render()}
    else if(act==='edit'){closeSheet();openSessionForm(wkKey,s)}
    else if(act==='del'){const f=sessionById(wkKey,s.id);if(f){f.plan.sessions=f.plan.sessions.filter(x=>x.id!==s.id);store.set(f.key,f.plan)}closeSheet();render();toast('انحذفت الجلسة')}
  });
}
function openSessionForm(wkKey,s,dayKey){
  closeSheet();
  const ws0=new Date(wkKey+'T00:00:00');
  const dayOpts=WEEK_ORDER.map((d,k)=>{const day=addDays(ws0,k),key=ymd(day);
    return `<option value="${key}" ${((s&&ymd(new Date(s.start))===key)||(!s&&dayKey===key))?'selected':''}>${fmtDay(day)}</option>`}).join('');
  const cOpts=S.data.courses.map(c=>`<option value="${c.id}" ${s&&s.courseId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const st=s?new Date(s.start):null,dur=s?Math.round((s.end-s.start)/60000):settings().len;
  sheetEl=mkModal(`<h2>${s?'تعديل جلسة':'جلسة جديدة'}</h2>
    <form id="sesForm" class="settings" style="grid-template-columns:1fr 1fr">
    <label style="grid-column:1/-1">العنوان<input id="fsTitle" required value="${s?esc(s.title):''}" placeholder="مثلاً: مراجعة فصل 3"></label>
    <label>المساق<select id="fsCourse"><option value="0">عام</option>${cOpts}</select></label>
    <label>اليوم<select id="fsDay">${dayOpts}</select></label>
    <label>الساعة<input type="time" id="fsTime" value="${st?pad(st.getHours())+':'+pad(st.getMinutes()):'18:00'}"></label>
    <label>المدة (دقيقة)<input type="number" id="fsDur" min="15" step="15" value="${dur}"></label>
    <div class="chips" style="grid-column:1/-1"><button type="submit" class="btn primary">حفظ</button><button type="button" class="btn ghost" data-sheet="close">إلغاء</button></div></form>`);
  sheetEl.addEventListener('click',ev=>{if(ev.target===sheetEl||ev.target.closest('[data-sheet="close"]'))closeSheet()});
  $('#sesForm').addEventListener('submit',ev=>{ev.preventDefault();
    const day=$('#fsDay').value,[hh,mm]=($('#fsTime').value||'18:00').split(':').map(Number);
    const start=new Date(day+'T00:00:00');start.setHours(hh,mm,0,0);
    const startMs=start.getTime(),endMs=startMs+(+$('#fsDur').value||60)*60000;
    const cid=+$('#fsCourse').value,c=courseOf(cid);
    const f=sessionById(wkKey,s?s.id:null)||{plan:store.get(K('plan:'+wkKey),{sessions:[]}),key:K('plan:'+wkKey)};
    const plan=f.plan||{sessions:[]};if(!plan.sessions)plan.sessions=[];
    const data={id:s?s.id:genId(),start:startMs,end:endMs,courseId:cid,color:c.color,ref:s?s.ref:'',title:$('#fsTitle').value.trim(),sub:c.name,kind:'custom',done:s?s.done:false,manual:true};
    const idx=s?plan.sessions.findIndex(x=>x.id===s.id):-1;
    if(idx>=0)plan.sessions[idx]=data;else plan.sessions.push(data);
    plan.sessions.sort((a,b)=>a.start-b.start);store.set(K('plan:'+wkKey),plan);
    closeSheet();render();toast(s?'تم التعديل':'انضافت الجلسة');
  });
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ================= boot ================= */
S.token=getToken();
if(S.token){const last=store.get('r:last',null),c=last&&store.get('r:'+last+':cache',null);
  if(c){S.uid=last;S.me=c.me;S.data=c.d}
  render();refresh();
}else render();
setInterval(()=>{const f=document.activeElement;if(S.data&&!S.loading&&!P.active&&!(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName)))render()},5*60000);
setInterval(checkDeadlines,10*60000);
})();
</script>
